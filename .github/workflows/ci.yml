# Continuous integration: every check a change must pass before it can be
# merged, on every pull request and every push to main.
#
# The jobs run in parallel, each on a fresh Ubuntu machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run, with the option to check the embedding snapshot against the
  # real embedding model (see the eval-gate job).
  workflow_dispatch:
    inputs:
      ollama:
        description: Also embed the eval queries with the real model (pulls ~5 GB, slow)
        type: boolean
        default: false
      prompt:
        description: The live eval's rules prompt ("degraded" must fail it)
        type: choice
        options: [default, degraded]
        default: default

# Least privilege: the workflow's token can read the repository and nothing
# else. No job here writes to GitHub.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes, so only
# the latest commit is checked. Runs on main are never cancelled, so every
# commit that lands there has a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to a major version: fixes and security patches arrive
# automatically, breaking changes do not. Pinning to a full commit SHA is
# stricter (the publisher cannot re-point it) and worth doing once something
# like Dependabot keeps the SHAs current.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Caches pip's download cache, keyed on pyproject.toml, so
          # dependencies download once rather than on every run.
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # --check reports unformatted files without changing them; running
      # `ruff format` locally (or the pre-commit hook) fixes them.
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Strict mode and the package list come from [tool.mypy] in
      # pyproject.toml, so CI and local runs check exactly the same thing.
      - run: mypy

  unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Unit tests only: fast, no Docker, no network, model calls mocked.
      # Tests that need a real database carry the `integration` marker and
      # run in their own job.
      - run: pytest -m "not integration"

  integration:
    name: Integration tests (pytest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Tests under tests/integration/ start a real pgvector container through
      # testcontainers, using the Docker engine GitHub's Ubuntu runners
      # provide. No database service is declared here: the tests manage
      # their own, exactly as they do on a developer's machine.
      - run: pytest -m integration

  eval-gate:
    name: Eval gate (retrieval, validator, resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The optional real-model check: Ollama on the runner's CPU, with the
      # pulled model cached between runs.
      - if: ${{ inputs.ollama }}
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-embedding-8b
      - if: ${{ inputs.ollama }}
        name: Start Ollama with the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do sleep 1; done
          ollama pull qwen3-embedding:8b
      # Loads the committed embedding snapshot into a throwaway pgvector
      # container (testcontainers, as the integration tests do), scores
      # retrieval, the validator and pool resolution, and fails below any
      # threshold in evals/thresholds.toml. The table goes to the run summary.
      - run: python -m mtg_deck_advisor.evaluation.gate ${{ inputs.ollama && '--ollama' || '' }}

  live-eval:
    name: Live eval (rules answers, real model)
    # Paid (a few cents a run, capped at $0.10), so it runs on main and on
    # demand, never on pull requests. Needs the ANTHROPIC_API_KEY secret.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_PROVIDER: anthropic
      # Required by the settings, but unused: the eval loads the snapshot into
      # its own throwaway database.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - if: ${{ inputs.ollama }}
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-embedding-8b
      - if: ${{ inputs.ollama }}
        name: Start Ollama with the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do sleep 1; done
          ollama pull qwen3-embedding:8b
      # Asks the real agent eight rules questions and checks citations and
      # "not found" by code against evals/live_thresholds.toml. The table goes
      # to the run summary.
      - run: >-
          python -m mtg_deck_advisor.evaluation.live_gate --yes
          --prompt ${{ inputs.prompt || 'default' }}
          ${{ inputs.ollama && '--ollama' || '' }}

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # BuildKit, which the Dockerfile's `RUN --mount=type=cache` needs.
      - uses: docker/setup-buildx-action@v4

      # Builds the image to prove it builds; nothing is pushed. type=gha keeps
      # the image's layers in GitHub's cache between runs, so an unchanged
      # dependency layer is not rebuilt. load: true makes the image available
      # to the next step.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mtg-deck-advisor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A smoke test of the built image: both entry points import, as the
      # unprivileged user the image runs as. It catches a runtime dependency
      # missing from the image, which no test outside the image would notice.
      - name: Smoke test the image
        run: |
          docker run --rm mtg-deck-advisor:ci python -c "import mtg_deck_advisor.api.app, mtg_deck_advisor.db.migrate"
          test "$(docker run --rm mtg-deck-advisor:ci id -un)" = app

  demo:
    name: Demo (Docker, replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The README's demo, exactly as a newcomer runs it: Compose builds the
      # image, migrates, seeds the demo dataset and starts the API, then
      # mtg-advisor build drafts, changes and exports a deck, and a rules
      # question is answered. Everything replays from recordings/demo, so it's
      # free and needs no secrets. A change that stops the recordings
      # replaying, such as a new prompt or tool schema, fails here.
      - name: Run the demo and check its decklist
        run: sh scripts/check_demo.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in step with the gitleaks hook in .pre-commit-config.yaml, so a
      # commit that passes locally is judged by the same rules here.
      GITLEAKS_VERSION: '8.30.0'
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the latest commit: a secret that was
          # added and later deleted is still readable in the repository.
          fetch-depth: 0
      # The gitleaks CLI directly, rather than gitleaks-action: the CLI is
      # MIT-licensed and needs no token, while the action posts PR comments
      # (which a read-only token cannot do). The download is checked against
      # the release's published checksums before it runs.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
      # --redact keeps any secret it finds out of the (public) job log.
      - run: ./gitleaks git --redact --verbose

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Checks every installed package against known vulnerabilities (the
      # PyPI advisory database). --skip-editable leaves out this project
      # itself, which is not published anywhere to look up.
      - run: pip-audit --skip-editable
