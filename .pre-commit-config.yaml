# Runs before every commit. Install once per clone: pre-commit install
# Secret scanning runs here as well as in CI (SEC-2): on a public repo a
# secret is exposed the moment it is pushed, so CI is too late to catch it.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The eval gate's embedding snapshot (~19 MB, ADR 0016) is large by
        # design; every other file still has the 500 KB limit.
        exclude: ^evals/snapshot/
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
