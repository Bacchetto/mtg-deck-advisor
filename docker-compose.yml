# Local stack: the database, a one-shot migration step, and the API.
#
#   docker compose up -d --build   build the image, then start everything:
#                                  db, then migrate (runs and exits), then app
#   docker compose ps -a           db and app "healthy"; migrate "Exited (0)"
#   docker compose up -d db        just the database, for running the API on
#                                  the host instead (python -m mtg_deck_advisor.api)
#   docker compose run --rm ingest cards
#                                  load Scryfall's card data (safe to repeat:
#                                  a run with nothing new changes nothing)
#   docker compose run --rm embed cards
#                                  embed the cards for search, through Ollama
#                                  on the host (only missing or stale ones)
#   docker compose down            stop everything; data survives in the volume
#   docker compose down -v         stop everything and delete all data
#
#   API:           http://127.0.0.1:8000/health
#   API docs:      http://127.0.0.1:8000/docs   (served by the running API)
#
# The API container and a host-run API both use port 8000, so run one or the
# other. After editing the source, rebuild with `--build`: the code is built
# into the image, never mounted.
#
# Values come from .env in this directory, which Compose reads automatically,
# falling back to the defaults below. The defaults match .env.example, so a
# fresh clone works with `cp .env.example .env` and nothing else.
#
# No bind mounts anywhere in this file: the repository lives on a network
# drive, and Rancher Desktop refuses to mount from it (ADR 0004). Anything a
# container needs is built into its image instead.

name: mtg-deck-advisor

services:
  db:
    # PostgreSQL 16 with the pgvector extension available. Pinned to an exact
    # pgvector release and Debian base, and kept in step with PGVECTOR_IMAGE in
    # tests/integration/conftest.py, so local runs and tests use one database.
    image: pgvector/pgvector:0.8.6-pg16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtg_deck_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-mtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg}
    ports:
      # Published on localhost only. Binding to all interfaces would expose a
      # database with a development password to the whole network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ passes a literal $ through to the container, so these are the
      # container's own variables rather than ones Compose substitutes.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # The app image, running the migration command instead of the server, then
    # exiting. Migrations are a separate step so the app never migrates on
    # startup (ADR 0003).
    build: .
    image: mtg-deck-advisor:local
    command: ["python", "-m", "mtg_deck_advisor.db.migrate"]
    environment: &app-environment
      # Inside the Compose network the database is the `db` service, not
      # 127.0.0.1. The credentials are the same ones db was created with.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD:-mtg}@db:5432/${POSTGRES_DB:-mtg_deck_advisor}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: development
      # Ollama runs natively on the host, for the GPU (ADR 0009). Rancher
      # Desktop maps host.docker.internal to the Windows host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_NAME: ${MODEL_NAME:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        # Wait for Postgres to accept connections, not merely to start.
        condition: service_healthy
    # The image's HEALTHCHECK probes the API, which this container never runs.
    healthcheck:
      disable: true

  app:
    build: .
    image: mtg-deck-advisor:local
    environment: *app-environment
    ports:
      # Localhost only, like the database.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # Start only once migrations have run and exited cleanly. A failed
        # migration keeps the app down rather than serving an old schema.
        condition: service_completed_successfully

  ingest:
    # Ingestion, run on demand rather than as part of `up`: the `tools`
    # profile keeps it out of the default stack. `docker compose run --rm
    # ingest <source>` picks the source, since the command is the argument.
    profiles: ["tools"]
    build: .
    image: mtg-deck-advisor:local
    entrypoint: ["python", "-m", "mtg_deck_advisor.ingestion"]
    command: ["cards"]
    environment: *app-environment
    volumes:
      # Downloaded source files, kept between runs so an unchanged source is
      # never downloaded twice.
      - cache:/var/cache/mtg-deck-advisor
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  embed:
    # Embedding for semantic search, run on demand after ingestion, like
    # ingest. It reaches Ollama on the host (OLLAMA_BASE_URL above).
    profiles: ["tools"]
    build: .
    image: mtg-deck-advisor:local
    entrypoint: ["python", "-m", "mtg_deck_advisor.retrieval.embed"]
    command: ["cards"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  # Named, so data outlives the container: `down` keeps it, `down -v` removes it.
  pgdata:
  cache:
