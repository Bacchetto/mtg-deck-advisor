[project]
name = "mtg-deck-advisor"
version = "0.1.0"
description = "AI-assisted Magic: The Gathering deck advisor (RAG, agents, guardrails, evals)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=26.1",
    # "binary" ships libpq inside the wheel, so no system Postgres client is needed.
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "sqlalchemy>=2.1",
    "fastapi>=0.142",
    "uvicorn>=0.54",
    # HTTP client for Scryfall and the rules download; also what FastAPI's
    # TestClient (from Starlette) is built on.
    "httpx2>=2.13",
    "tenacity>=9.1",
    # The official Claude SDK. 1.x is built on httpx2, like the rest of the project.
    "anthropic>=1.11",
]

[project.scripts]
mtg-advisor = "mtg_deck_advisor.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    # Exact pin, matching the ruff hook in .pre-commit-config.yaml: formatter
    # output can change between versions, and CI must agree with the hook.
    "ruff==0.16.9",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "testcontainers[postgres]>=4.15",
    # Property-based testing: generates many inputs to check rules that must
    # hold for every deck, not just hand-picked examples.
    "hypothesis>=6.150",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_deck_advisor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.isort]
# Declared explicitly because ruff otherwise decides first-party by finding
# the imported module on disk. Test-first means a test imports a module that
# does not exist yet, which ruff would then sort as third-party.
known-first-party = ["mtg_deck_advisor"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Tests too: typed tests catch misused fixtures and stale type: ignores.
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real services (e.g. Postgres + pgvector in Docker)",
    "live: calls a real, possibly paid, external service; skipped unless --live",
]
